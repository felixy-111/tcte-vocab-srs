<script>
"use strict";
/* ============================================================
   常數
   ============================================================ */
const STORE_KEY = "tsvt-srs-v2";
const EXAM_DATE = "2027-04-24";      // 統測日期（簡章公告後改這裡）
const SWEEP_DAYS = 42;               // 考前 6 週：每張卡至少到期一次
const MAX_IVL = 45;                  // 最大間隔（天）
const RETENTION = 0.9;
const STEPS = [1, 10];               // 新字當天的學習步驟（分）：拼對一次 → 10 分後再拼對一次才算過
const RELEARN = [1];                 // 舊字拼錯：1 分後再拼對一次
const MIN_GAP = 3;                   // 拼錯的卡至少隔幾張才再出
const GOOD_MS = 20000;               // 20 秒內拼對＝良好，超過＝困難
const BUDGET_SEC = 1200;             // 每日份量（約 20 分鐘）；本批強制練習不受此限
const FIRST_CHECK_PER_DAY = 20;      // 舊字首次檢測每天幾項
const BACKLOG_PAUSE = 30;            // 積欠的到期複習超過幾張就暫停當天的舊字首檢
const BOOST_EVERY = 4;               // 同一字今天錯滿 4 次 → 加強卡
const COST = { input: 25, recog: 6, recall: 15, boost: 40 };   // 估計秒數
const MIN = 60e3, HOUR = 3600e3, DAY = 86400e3;
// FSRS-5 預設參數
const W = [0.40255, 1.18385, 3.173, 15.69105, 7.1949, 0.5345, 1.4604, 0.0046, 1.54575, 0.1192, 1.01925,
           1.9395, 0.11, 0.29605, 2.2698, 0.2315, 2.9898, 0.51655, 0.6621];
const DECAY = -0.5, FACTOR = 19 / 81;

/* ============================================================
   時間（台北時間、凌晨 4 點換日）
   ============================================================ */
const qs = new URLSearchParams(location.search);
let clockOffset = 0;
const clock = { t: null };           // selftest 用假時鐘
const now = () => clock.t != null ? clock.t : Date.now() + clockOffset;
if (qs.get("today") && /^\d{4}-\d{2}-\d{2}$/.test(qs.get("today"))) {
  clockOffset = Date.parse(qs.get("today") + "T19:00:00+08:00") - Date.now();
}
const dayOf = (t) => new Date(t + 4 * HOUR).toISOString().slice(0, 10);   // +8 -4
const dayStart = (d) => Date.parse(d + "T04:00:00+08:00");
const addDays = (d, n) => new Date(Date.parse(d + "T00:00:00Z") + n * DAY).toISOString().slice(0, 10);
const daysBetween = (a, b) => Math.round((Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z")) / DAY);
const WK = "日一二三四五六";
const fmtDay = (d) => `${+d.slice(5, 7)}/${+d.slice(8)}（${WK[new Date(d + "T00:00:00Z").getUTCDay()]}）`;
const SWEEP_START = addDays(EXAM_DATE, -SWEEP_DAYS);

/* ============================================================
   FSRS（每個字一張長期卡＝中→英拼寫；只吃當天第一次作答）
   ============================================================ */
const clampD = (d) => Math.min(10, Math.max(1, d));
const fsrs = {
  R: (t, s) => Math.pow(1 + FACTOR * t / s, DECAY),
  ivl: (s) => s / FACTOR * (Math.pow(RETENTION, 1 / DECAY) - 1),
  initS: (g) => Math.max(W[g - 1], 0.1),
  initD: (g) => clampD(W[4] - Math.exp(W[5] * (g - 1)) + 1),
  nextD: (d, g) => clampD(W[7] * fsrs.initD(4) + (1 - W[7]) * (d - W[6] * (g - 3) * (10 - d) / 9)),
  recallS: (d, s, r, g) => s * (1 + Math.exp(W[8]) * (11 - d) * Math.pow(s, -W[9]) * (Math.exp((1 - r) * W[10]) - 1) *
    (g === 2 ? W[15] : 1) * (g === 4 ? W[16] : 1)),
  forgetS: (d, s, r) => Math.min(s, W[11] * Math.pow(d, -W[12]) * (Math.pow(s + 1, W[13]) - 1) * Math.exp((1 - r) * W[14])),
};
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

// 間隔天數 → 到期時間（到期日凌晨 4 點），套上限 45 天＋考前總掃
function scheduleDue(t, ivlDays, key) {
  const today = dayOf(t);
  const n = Math.min(MAX_IVL, Math.max(1, Math.round(ivlDays)));
  let due = addDays(today, n);
  if (today < SWEEP_START && due >= addDays(EXAM_DATE, -7)) {
    // 下次到期會跳過考前總掃 → 拉回總掃區間內（依卡片分散，避免全擠同一天）
    const spread = addDays(SWEEP_START, hash(key) % (SWEEP_DAYS - 7));
    due = spread > today ? spread : addDays(today, 1);
  } else if (today >= SWEEP_START && due >= EXAM_DATE) {
    due = today < addDays(EXAM_DATE, -1) ? addDays(EXAM_DATE, -1) : addDays(today, 1);
  }
  return dayStart(due);
}

// g：1=重來 2=困難 3=良好 4=簡單（只有舊字首次檢測用到）
function review(id, g, t) {
  let c = S.cards[id];
  if (!c) {
    c = S.cards[id] = { st: fsrs.initS(g), df: fsrs.initD(g), reps: 0, lapses: 0, last: 0, due: 0 };
  } else {
    const r = fsrs.R(Math.max(0, (t - c.last) / DAY), c.st);
    c.st = Math.max(0.1, g === 1 ? fsrs.forgetS(c.df, c.st, r) : fsrs.recallS(c.df, c.st, r, g));
    c.df = fsrs.nextD(c.df, g);
    if (g === 1) c.lapses++;
  }
  c.due = scheduleDue(t, g === 1 ? 1 : fsrs.ivl(c.st), id);
  c.reps++; c.last = t;
  reviewCalls++;
  return c;
}
let reviewCalls = 0;

/* ============================================================
   狀態（localStorage，經 syncAdapter）
   ============================================================ */
// 同步接縫：之後雲端同步只要換掉這個物件（load 回傳 state 或 null；save 存整包）
const syncAdapter = {
  load() { try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { return null; } },
  save(state) { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { console.warn("存檔失敗", e); } },
};
let store = syncAdapter;
// cards：{字: FSRS 狀態}；intro：新字輸入看過的時間；days：每天的任務與紀錄（老師端讀這裡）；log：逐次作答
const freshState = () => ({ v: 2, cards: {}, intro: {}, days: {}, log: [] });
let S = freshState();
const save = () => store.save(S);

/* ============================================================
   雲端同步（Supabase）。CONFIG 留空＝只存這台裝置（跟以前完全一樣）
   - 學生不用登入：老師給的連結 ?s=代碼（32 個十六進位字）存在這台裝置；雲端只認代碼
   - 本機優先：每次存檔照樣先寫 localStorage；有網路才在背景上傳「改過的部分」
   - 雲端有版本號：上傳時附「我上次看到的版本」，被別台搶先就先合併再重送（不會互蓋）
   - 這台沒成功下載過雲端進度之前，絕不上傳（新手機／空裝置蓋不掉雲端）
   - 每次開網頁先整包下載合併；上傳前跟雲端那包照合併規則比，只送較新的卡／進度較多的那天（雲端只會前進）
   ============================================================ */
const CONFIG = { SUPABASE_URL: "https://knsdpvmhloobfduhfwyk.supabase.co", SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtuc2Rwdm1obG9vYmZkdWhmd3lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNzMyMTMsImV4cCI6MjA5OTg0OTIxM30.HiH0OjKi1CllfM31YL2ETn3bxM9omzAtAF3QSQqnK80" };   // 填值前先跑 supabase/001_srs.sql
const CLOUD = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
const SYNC_KEY = "tsvt-srs-sync";
const TOKEN_RE = /^[0-9a-f]{32}$/;
const LOG_CAP = 5000;

// 穩定的 JSON（key 排序）：雲端 jsonb 會打亂 key 順序，比對前要先統一
function canon(v) {
  if (Array.isArray(v)) return "[" + v.map((x) => x === undefined ? "null" : canon(x)).join(",") + "]";
  if (v && typeof v === "object") return "{" + Object.keys(v).filter((k) => v[k] !== undefined).sort()
    .map((k) => JSON.stringify(k) + ":" + canon(v[k])).join(",") + "}";
  return JSON.stringify(v);
}

// 別台／雲端來的資料：形狀不對的項目直接丟掉（不讓它弄壞畫面或老師端）
const isObj = (o) => !!o && typeof o === "object" && !Array.isArray(o);
const fin = (x) => typeof x === "number" && isFinite(x);
const okKey = (k) => k !== "__proto__" && k !== "constructor" && k !== "prototype" && k.length <= 100;
const okCard = (c) => isObj(c) && ["st", "df", "reps", "lapses", "last", "due"].every((k) => fin(c[k]));
const okDay = (d) => isObj(d) && Array.isArray(d.set) && d.set.every((x) => typeof x === "string") &&
  Array.isArray(d.queue) && d.queue.every((e) => isObj(e) && typeof e.id === "string") &&
  isObj(d.graded) && isObj(d.fails) && isObj(d.boosts) && isObj(d.mockFirst) && fin(d.ans) && fin(d.ms);
const okLog = (e) => isObj(e) && fin(e.t) && typeof e.id === "string";
const logKey = (e) => e.t + "|" + e.id;
function cleanState(x) {
  const s = freshState();
  if (!isObj(x)) return s;
  if (isObj(x.cards)) for (const k of Object.keys(x.cards)) if (okKey(k) && okCard(x.cards[k])) s.cards[k] = x.cards[k];
  if (isObj(x.intro)) for (const k of Object.keys(x.intro)) if (okKey(k) && fin(x.intro[k])) s.intro[k] = x.intro[k];
  if (isObj(x.days)) for (const k of Object.keys(x.days)) if (/^\d{4}-\d{2}-\d{2}$/.test(k) && okDay(x.days[k])) s.days[k] = x.days[k];
  if (Array.isArray(x.log)) s.log = x.log.filter(okLog);
  return s;
}

// 合併兩份進度（L＝這台、R＝雲端）。keepDay：正在作答的那天一律留這台的（作答中的隊伍不能被換掉）
function newerCard(a, b) {
  if (!a) return b; if (!b) return a;

// 同步引擎。o：{ rpc(name,args)→Promise<回傳值>（網路錯丟 {offline:true}）, getS, setS, saveLocal, metaLoad, metaSave,

function makeSync(o) {

    if (!snap) return doPull();                  // 這次開網頁還沒拿到雲端整包 → 先下載合併（成功後它會接著上傳）

  banks.forEach((b) => (BANK_ITEMS[b] || []).forEach((it) => {

function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0) / 4294967296; }; }
function shuffle(a, seed) { const r = seed != null ? rng(seed) : Math.random; a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const normSpell = (s) => String(s == null ? "" : s).normalize("NFKC").toLowerCase().replace(/[’‘`]/g, "'")
  .replace(/\s+/g, " ").trim().replace(/[.,!?。，]+$/, "").trim();
const spellOk = (it, typed) => { const n = normSpell(typed); return n !== "" && it.accept.concat([it.ans]).some((a) => normSpell(a) === n); };
const hintOf = (s) => s.split(" ").map((w) => w.split("").map((ch, i) => i === 0 || !/[a-z]/i.test(ch) ? ch : "_").join("")).join("  ");
const letters = (s) => (s.match(/[a-z]/gi) || []).length;
const collFront = (c) => esc(c.en).replace(/\[[^\]]*\]/g, "____");
const collBack = (c) => esc(c.en).replace(/\[([^\]]*)\]/g, "<b>$1</b>");
function hlSent(s) {
  const e = esc(s.en);
  if (!s.hl) return e;
  const h = esc(s.hl), i = e.toLowerCase().indexOf(h.toLowerCase());
  return i < 0 ? e : e.slice(0, i) + "<b>" + e.slice(i, i + h.length) + "</b>" + e.slice(i + h.length);
}
function distractors(it) {
  const pool = DATA.items.filter((x) => x.id !== it.id && x.kind === it.kind && x.zh !== it.zh);
  const p1 = it.pos.split("/")[0];
  const tiers = [
    pool.filter((x) => x.unit === it.unit && x.pos.split("/")[0] === p1),
    pool.filter((x) => x.unit === it.unit),
    pool.filter((x) => x.pos.split("/")[0] === p1),
    pool,
  ];
  const out = [];
  for (const tier of tiers) for (const x of shuffle(tier)) {
    if (out.length < 3 && !out.some((o) => o.zh === x.zh)) out.push(x);
  }
  return shuffle(out.map((x) => x.zh).concat([it.zh]));
}

/* ============================================================
   音檔：全程只用同一個 <audio>（Android 同時太多 media element 會壞）

const au = document.getElementById("au");
function play(file) {
  if (!file || clock.t != null) return;
  au.src = "audio/" + file;
  const p = au.play();
  if (p && p.catch) p.catch((e) => { if (e.name !== "AbortError" && e.name !== "NotAllowedError") console.warn("audio", e.name); });
}
const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M18.5 5.5a9 9 0 010 13"/></svg>';
const playBtn = (file, label) => `<button class="play" data-play="${esc(file)}">${SPK}${label || "發音"}</button>`;
document.addEventListener("click", (e) => {

/* ---------- 作答流程 ---------- */
let session = null;
function startSession(Q, kind) { session = { Q, kind, n: 0 }; nextCard(); }
function nextCard() {
  const t = now(), Q = session.Q;
  const pk = pick(Q, t);
  if (!pk) return sessionDone();
  session.n++;
  if (session.kind === "free") setHeader("練習", `還剩 ${Q.queue.filter((e) => e.k === "recall").length} 張（不影響今天過關）`, true);
  else setHeader("今日任務", `${Q.set.length} 張・已過 ${passedCount(Q)}・還要約 ${Math.ceil(remainSec(Q) / 60)} 分鐘`, true);
  ({ input: renderInput, recog: renderRecog, recall: renderRecall, boost: renderBoost })[pk.e.k](pk);
}
function sessionDone() {
  const kind = session.kind;
  session = null;
  if (kind === "daily") return home();
  setHeader("完成", "", true);
  main.innerHTML = `<div class="card center"><div class="big" style="font-size:20px">這組練完了</div>
    <button class="btn mt" id="goHome">回首頁</button></div>`;
  $("goHome").onclick = home;
}
function picHtml(it) {
  if (it.img) return `<div class="pic"><img src="img/${esc(it.img)}" alt=""></div>`;
  if (it.emoji) return `<div class="pic"><span class="emo">${esc(it.emoji)}</span></div>`;
  return "";
}
function sentHtml(s) {
  const f = s.form ? `<div class="formtag">${esc(s.form.en)}${s.form.pos || s.form.zh ? `（${esc([s.form.pos, s.form.zh].filter(Boolean).join(" "))}）` : ""}</div>` : "";
  return `<div class="sent" data-play="${esc(s.audio)}">${f}${hlSent(s)} ${SPK.replace("<svg", '<svg style="width:14px;height:14px;vertical-align:-2px;color:#4A7BC8"')}
    ${s.zh ? `<div class="zh">${esc(s.zh)}</div>` : ""}</div>`;
}
const TAGS = { mock: '<span class="tag red">明天要考</span>', batch: '<span class="tag green">本批</span>', new: '<span class="tag green">新字</span>',
  fc: '<span class="tag">首次檢測</span>', rev: '<span class="tag">複習</span>' };
function backHtml(it, n) {
  return `<div class="word mt">${esc(it.en)}</div>
    <div class="pos">${esc(it.pos)}　${playBtn(it.audio)}</div>
    ${picHtml(it)}
    <div class="zhbig" style="font-size:20px">${esc(it.zh)}</div>
    ${it.sentences.length ? `<div class="lbl mt">例句（點句子聽發音）</div>` + it.sentences.slice(0, n).map(sentHtml).join("") : ""}
    ${it.collocations.length ? `<div class="lbl mt">常見搭配</div><div class="colls">${it.collocations.map((c) => `<div>${collBack(c)}　<span class="mut">${esc(c.zh)}</span></div>`).join("")}</div>` : ""}
    ${it.derivatives.length ? `<div class="deriv">相關字：${it.derivatives.map(esc).join("、")}</div>` : ""}`;
}

function renderInput(pk) {
  const it = ITEMS[pk.e.id];
  main.innerHTML = `<div class="q"><div><span class="tag green">新字輸入</span><span class="tag">${bankName(it.bank)}</span></div>
    ${backHtml(it, 2)}<button class="btn mt" id="ok">記好了，開始練習</button></div>`;
  play(it.audio);
  $("ok").onclick = () => { finishOther(session.Q, pk, now()); nextCard(); };
}

// 新字輸入當天的「認得」練習：英→中選擇，不進長期排程
function renderRecog(pk) {
  const it = ITEMS[pk.e.id];
  const opts = distractors(it);
  main.innerHTML = `<div class="q"><div><span class="tag green">新字</span><span class="tag">認得</span></div>
    <div class="word mt">${esc(it.en)}</div>
    <div class="pos">${esc(it.pos)}　${playBtn(it.audio)}</div>
    <div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>
    <div id="fb"></div></div>`;
  play(it.audio);
  let done = false;
  main.querySelectorAll(".opt").forEach((btn) => btn.onclick = () => {
    if (done) return; done = true;
    const ok = opts[+btn.dataset.i] === it.zh;
    main.querySelectorAll(".opt").forEach((b) => { if (opts[+b.dataset.i] === it.zh) b.classList.add("correct"); });
    if (!ok) btn.classList.add("wrong");
    finishOther(session.Q, pk, now());
    if (ok) setTimeout(() => { if (session) nextCard(); }, 700);
    else { $("fb").innerHTML = `<button class="btn mt" id="nx">下一張</button>`; $("nx").onclick = nextCard; }
  });
}

// 每日主卡：中→英拼寫。打字一定在翻面之前；送出才翻面
function renderRecall(pk) {
  const e = pk.e, it = ITEMS[e.id];
  const t0 = performance.now();
  const again = (session.Q.fails || {})[e.id];
  main.innerHTML = `<div class="q" data-id="${esc(e.id)}">
    <div>${TAGS[e.tag] || ""}${again ? '<span class="tag red">再拼一次</span>' : ""}<span class="tag">拼寫</span></div>
    <div class="zhbig mt">${esc(it.zh)}</div>
    <div class="pos">${esc(it.pos)}</div>
    ${it.collocations.length ? `<div class="colls">${it.collocations.map((c) => `<div>${collFront(c)}　<span class="mut">${esc(c.zh)}</span></div>`).join("")}</div>` : ""}
    <div class="hint">${esc(hintOf(it.ans))}</div>
    <div class="center small mut">共 ${letters(it.ans)} 個字母</div>
    <input class="tinput mt" id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
    <div class="row2 mt"><button class="btn ghost" id="skip">不會（看答案）</button><button class="btn" id="go">確定</button></div>
    <div id="fb"></div></div>`;
  const inp = $("inp");
  inp.focus();   // 要在點擊的同一個事件裡 focus，iOS 才會叫出鍵盤
  let done = false;
  const submit = (giveUp) => {
    if (done) return;
    if (!giveUp && !inp.value.trim()) return;
    done = true;
    const ok = !giveUp && spellOk(it, inp.value);
    const ms = performance.now() - t0;
    const g = answerRecall(session.Q, pk, ok, ms, now());
    const label = g === 1 ? "重來" : `${g === 2 ? "困難" : "良好"}・${Math.round(ms / 1000)} 秒`;
    main.innerHTML = `<div class="q">
      <div><span class="grade g${g}">${label}</span>${!ok && !giveUp ? `　<span class="small mut">你拼：${esc(inp.value)}</span>` : ""}</div>
      ${backHtml(it, 2)}
      <button class="btn mt" id="nx">下一張</button></div>`;
    play(it.audio);
    $("nx").onclick = nextCard;
    window.scrollTo(0, 0);
  };
  $("go").onclick = () => submit(false);
  $("skip").onclick = () => submit(true);
  inp.onkeydown = (ev) => { if (ev.key === "Enter") submit(false); };
}

// 加強卡：同一字今天錯滿 4 次 → 例句＋發音＋照抄 3 次
function renderBoost(pk) {
  const it = ITEMS[pk.e.id];
  main.innerHTML = `<div class="q"><div><span class="tag red">加強卡</span><span class="small mut">這個字今天錯好幾次了，慢慢看、照著打三次</span></div>
    ${backHtml(it, 3)}
    <div class="lbl mt">照著打 3 次：${esc(it.ans)}</div>
    <div class="copy">${[0, 1, 2].map((i) => `<input class="tinput cp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">`).join("")}</div>
    <button class="btn mt" id="ok" disabled>完成，回去再拼一次</button></div>`;
  play(it.audio);
  const cps = [...main.querySelectorAll(".cp")];
  cps.forEach((c) => c.oninput = () => {
    c.classList.toggle("correct", spellOk(it, c.value));
    $("ok").disabled = !cps.every((x) => spellOk(it, x.value));
  });
  $("ok").onclick = () => { finishOther(session.Q, pk, now()); nextCard(); };
}

/* ---------- 閱讀 ---------- */
function readingList() {
  setHeader("閱讀", "這一回的字都練過一次就解鎖", true);
  const day = dayOf(now());
  const banks = DATA.banks.filter((b) => DATA.readings[b] && (LEARNED.includes(b) || SCHEDULE.some((s) => s.bank === b && s.date <= day)));
  main.innerHTML = `<div class="card list">${banks.map((b) => {
    const its = BANK_ITEMS[b], d = its.filter((i) => seen(i.id)).length, open = d === its.length;
    return DATA.readings[b].map((r) => `<a href="#" class="${open ? "" : "lock"}" data-b="${b}" data-r="${esc(r.id)}">
      <span>${bankName(b)}　${esc(r.title)}</span><span class="small mut">${open ? "閱讀" : `${d}/${its.length} 練過`}</span></a>`).join("");
  }).join("") || '<div class="mut">還沒有可讀的短文</div>'}</div>`;
  main.querySelectorAll(".list a").forEach((a) => a.onclick = (e) => { e.preventDefault(); showReading(a.dataset.b, a.dataset.r); });
}
function showReading(bank, rid) {
  const r = DATA.readings[bank].find((x) => x.id === rid);
  setHeader(r.title, bankName(bank) + "　點紅字聽發音", true);
  const marks = [];
  r.words.forEach((w) => w.forms.forEach((f) => marks.push({ f, id: w.id })));
  marks.sort((a, b) => b.f.length - a.f.length);
  let text = r.text;
  const slots = [];
  marks.forEach((m) => {   // 先換成佔位，避免巢狀取代
    const src = "\\b" + m.f.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/\s+/g, "\\s+") + "\\b";
    let hit = false;
    text = text.replace(new RegExp(src, "g"), (x) => { hit = true; slots.push({ x, ids: [m.id] }); return "\u0000" + (slots.length - 1) + "\u0001"; });
    // 整個被較長的字／片語吃掉了（filled ⊂ be filled with、take off＝take ... off）→ 掛在同一個紅字上
    if (!hit) slots.forEach((sl) => { if (!sl.ids.includes(m.id) && new RegExp(src, "i").test(sl.x)) sl.ids.push(m.id); });
  });
  const html = esc(text).replace(/\u0000(\d+)\u0001/g, (_, i) => `<span class="w" data-ids="${esc(slots[i].ids.join("|"))}">${esc(slots[i].x)}</span>`);
  main.innerHTML = `<div class="card reading">${html}</div>`;
  main.querySelectorAll(".w").forEach((s) => s.onclick = () => {
    const its = s.dataset.ids.split("|").map((id) => ITEMS[id]);
    play(its[0].audio); toast(its.map((it) => it.en + "　" + it.zh).join("／"));
  });
}

/* ============================================================
   Supabase SDK（本地 vendored 檔，跟統測字彙 app 同一份；只有 CONFIG 有填才載入）
   ============================================================ */
function loadSdk() {
  if (window.supabase) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "vendor/supabase.js"; s.onload = res; s.onerror = () => rej(new Error("SDK 載入失敗"));
    document.head.appendChild(s);
  });
}

/* ============================================================
   老師端（?teacher=1）：Supabase 帳號登入 → 選學生 → 儀表板
   學生進度是學生端寫的資料（較不可信）：畫面上每個字串都要 esc()，只顯示題庫裡有的字

let tsb = null;
const fmtTime = (iso) => iso ? new Date(iso).toLocaleString("zh-TW", { timeZone: "Asia/Taipei", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false }) : "—";
async function tq(p) { const r = await p; if (r.error) throw r.error; return r.data; }

async function teacherBoot() {
  $("syncSt").textContent = "老師端";
  $("back").onclick = () => teacherHome();
  setHeader("老師端", "", false);

function linkCard(name, token) {
  const url = location.origin + location.pathname + "?s=" + token;
  return `<div class="card"><div class="lbl">「${esc(name)}」的專屬連結</div>
    <input class="lnk" id="lnk" readonly value="${esc(url)}">
    <button class="btn mt" id="cp">複製連結</button>
    <div class="warn">這個連結只會顯示這一次（雲端只存它的指紋）。請私訊給學生本人，不要貼到群組。
    弄丟了就按「重新產生連結」，舊的會立刻失效（進度不會不見）。</div></div>`;
}
function bindCopy() {
  if (!$("cp")) return;
  $("cp").onclick = () => {
    const v = $("lnk").value;
    (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject())
      .then(() => toast("已複製"), () => { $("lnk").select(); toast("請長按連結手動複製"); });
  };
}
const logoutHtml = `<button class="btn ghost mt" id="logout">登出</button>`;
function bindLogout() { if ($("logout")) $("logout").onclick = async () => { await tsb.auth.signOut(); teacherLogin(); }; }

async function teacherHome(flash) {
  setHeader("老師端", "學生每日練習狀況", false);
  main.innerHTML = `<div class="card mut">載入中…</div>`;
  let isT, list, states;
  try {
    isT = await tq(tsb.rpc("srs_is_teacher"));
    if (isT) {
      list = await tq(tsb.from("srs_students").select("id,name,created_at").order("created_at"));
      states = await tq(tsb.from("srs_state").select("student_id,updated_at"));
    }
  } catch (e) {
    main.innerHTML = `<div class="card">讀取失敗：${esc(e.message || e)}<div class="small mut mt">第一次用的話，請確認已在 Supabase 執行過 supabase/001_srs.sql。</div></div>${logoutHtml}`;
    return bindLogout();
  }
  if (!isT) {
    main.innerHTML = `<div class="card">這個帳號沒有老師權限（不在 srs_teachers 名單裡）。</div>${logoutHtml}`;
    return bindLogout();
  }
  const upd = {};
  states.forEach((s) => { upd[s.student_id] = s.updated_at; });
  main.innerHTML = (flash || "") + `<div class="card list"><div class="lbl">學生</div>
    ${list.map((s) => `<a href="#" data-id="${esc(s.id)}" data-name="${esc(s.name)}"><span>${esc(s.name)}</span><span class="small mut">最後同步 ${esc(fmtTime(upd[s.id]))}</span></a>`).join("")
      || '<div class="mut small">還沒有學生，先在下面新增。</div>'}</div>
    <div class="card"><div class="lbl">新增學生</div>
      <input class="tinput" id="nm" maxlength="40" placeholder="暱稱（不要用全名）" style="font-size:17px">
      <button class="btn blue mt" id="add">新增並產生專屬連結</button></div>
    ${logoutHtml}`;
  bindCopy(); bindLogout();
  main.querySelectorAll(".list a").forEach((a) => a.onclick = (e) => { e.preventDefault(); teacherStudent(a.dataset.id, a.dataset.name); });
  $("add").onclick = async () => {
    const name = $("nm").value.trim();
    if (!name) return toast("先填暱稱");
    $("add").disabled = true;
    try {
      const r = await tq(tsb.rpc("srs_create_student", { p_name: name }));
      if (!r || !r.ok) throw new Error(r && r.error === "bad_name" ? "暱稱要 1～40 個字" : "新增失敗");
      teacherHome(linkCard(r.name, r.token));
    } catch (e) { toast(e.message || "新增失敗"); $("add").disabled = false; }
  };
}

async function teacherStudent(id, name, flash) {
  setHeader(name, "載入中…", true);
  main.innerHTML = `<div class="card mut">載入中…</div>`;
  let row;
  try { row = await tq(tsb.from("srs_state").select("state,updated_at").eq("student_id", id).maybeSingle()); }
  catch (e) { main.innerHTML = `<div class="card">讀取失敗：${esc(e.message || e)}</div>`; return; }
  const st = cleanState(row && row.state);
  setHeader(name, "最後同步 " + fmtTime(row && row.updated_at), true);
  main.innerHTML = (flash || "") + dashHtml(st, now()) +
    `<div class="row2"><button class="btn ghost" id="rf">重新整理</button><button class="btn ghost" id="rl">重新產生連結</button></div>`;
  bindCopy();
  $("rf").onclick = () => teacherStudent(id, name);
  $("rl").onclick = async () => {
    if (!confirm(`重新產生「${name}」的連結？\n舊連結會立刻失效，學生要用新連結重新打開一次（進度不會不見）。`)) return;
    try {
      const r = await tq(tsb.rpc("srs_reset_link", { p_student: id }));
      if (!r || !r.ok) throw new Error("重設失敗");
      teacherStudent(id, name, linkCard(name, r.token));
    } catch (e) { toast(e.message || "重設失敗"); }
  };
}

// 儀表板（純函式：吃一份進度＋時間 → HTML；selftest 會測）
function dashHtml(st, t) {
  const day = dayOf(t), Dt = st.days[day];
  const Rof = (id, at) => { const c = st.cards[id]; return c ? fsrs.R(Math.max(0, ((at || t) - c.last) / DAY), Math.max(0.1, c.st)) : null; };
  const pct = (r) => r == null ? "—" : Math.round(r * 100) + "%";
  const mins = (ms) => Math.round((+ms || 0) / MIN);
  const failsOf = (id, from) => { let n = 0; for (const d in st.days) if (d >= from && d <= day) n += +st.days[d].fails[id] || 0; return n; };
  let h = "";
  // 今天
  h += `<div class="card"><div class="lbl">今天 ${esc(fmtDay(day))}</div>`;
  if (!Dt || !Dt.ans) h += `<div class="big">今天還沒開始</div>`;
  else h += `<div class="big" style="color:${Dt.passed ? "var(--green)" : "var(--red)"}">${Dt.passed ? "今天已過關" : "今天還沒過關"}</div>
    <div class="small mut">清單 ${Dt.set.length} 張・已過 ${passedCount(Dt)}・作答 ${+Dt.ans} 次・約 ${mins(Dt.ms)} 分鐘</div>`;
  h += `</div>`;
  // 近 14 天
  const cells = [];
  let nPass = 0, nMin = 0;
  for (let i = 13; i >= 0; i--) {
    const d = addDays(day, -i), D = st.days[d];
    const cls = D && D.passed ? "ok" : D && D.ans ? "part" : "";
    if (D && D.passed) nPass++;
    nMin += D ? mins(D.ms) : 0;
    cells.push(`<div class="${cls}${i === 0 ? " td" : ""}">${+d.slice(5, 7)}/${+d.slice(8)}<b>${D && D.passed ? "過" : D && D.ans ? "未完" : "—"}</b>${D && D.ans ? mins(D.ms) + "分" : ""}</div>`);
  }
  h += `<div class="card"><div class="lbl">近 14 天</div><div class="cal">${cells.join("")}</div>
    <div class="small mut mt">過關 ${nPass} 天・共約 ${nMin} 分鐘（綠＝過關、黃＝有做沒做完）</div></div>`;
  // 本批
  const b = curBatch(day) || SCHEDULE.find((x) => x.date > day);
  h += `<div class="card"><div class="lbl">本批準備度</div>`;
  if (!b || !BANK_ITEMS[b.bank]) h += `<div class="mut">目前沒有排定的新進度</div>`;
  else {
    const its = BANK_ITEMS[b.bank], mock = Dt && Dt.mock === b.bank;
    const exam = Math.max(t, Date.parse(b.testDate + "T19:00:00+08:00"));   // 剛答完的字記憶率一定 100%，看「考試當天」才有意義
    const stat =(id) => !Dt || !Dt.set.includes(id) ? ["今天沒排", "mut"] : Dt.queue.some((e) => e.id === id) ? ["還沒過", "red"] : ["過了", "green"];
    const nOk = its.filter((i) => stat(i.id)[0] === "過了").length, nR = its.filter((i) => (Rof(i.id, exam) || 0) >= 0.9).length;
    h += `<div class="big">${esc(bankName(b.bank))}　${esc(fmtDay(b.testDate))} 上課考</div>
      <div class="small mut">今天過了 ${nOk}/${its.length}・考試當天預估記憶率 ≥ 90% 的 ${nR}/${its.length}${mock ? `・模擬考第一次對 ${Object.values(Dt.mockFirst).filter(Boolean).length}/${its.length}` : ""}</div>
      <table class="t mt"><tr><th>字</th><th>今天</th><th class="n">今天錯</th><th class="n">本批累計錯</th><th class="n">考試日記憶率</th>${mock ? '<th class="n">模擬考</th>' : ""}</tr>
      ${its.map((it) => { const s = stat(it.id); return `<tr><td><b>${esc(it.en)}</b><div class="small mut">${esc(it.zh)}</div></td>
        <td><span class="tag ${s[1]}">${s[0]}</span></td><td class="n">${Dt ? +Dt.fails[it.id] || 0 : 0}</td><td class="n">${failsOf(it.id, b.date)}</td>
        <td class="n">${pct(Rof(it.id, exam))}</td>${mock ? `<td class="n">${it.id in Dt.mockFirst ? (Dt.mockFirst[it.id] ? "對" : "錯") : "—"}</td>` : ""}</tr>`; }).join("")}</table>`;
  }
  h += `</div>`;
  // 弱字前 20
  const weak = Object.keys(st.cards).filter((id) => ITEMS[id]).map((id) => ({ id, lapses: +st.cards[id].lapses || 0, fails: failsOf(id, "") }))
    .filter((x) => x.lapses + x.fails > 0).sort((a, c) => c.lapses - a.lapses || c.fails - a.fails).slice(0, 20);
  h += `<div class="card"><div class="lbl">最常忘的字（前 20）</div>${weak.length ? `<table class="t"><tr><th>字</th><th class="n">遺忘次數</th><th class="n">累計拼錯</th><th class="n">記憶率</th></tr>
    ${weak.map((x) => `<tr><td><b>${esc(ITEMS[x.id].en)}</b> <span class="small mut">${esc(ITEMS[x.id].zh)}</span><div class="small mut">${esc(bankName(ITEMS[x.id].bank))}</div></td>
      <td class="n">${x.lapses}</td><td class="n">${x.fails}</td><td class="n">${pct(Rof(x.id))}</td></tr>`).join("")}</table>` : '<div class="mut small">還沒有拼錯紀錄</div>'}</div>`;
  // 各單元記憶率
  const rows = DATA.banks.map((bk) => {
    const its = BANK_ITEMS[bk] || [], rs = its.map((i) => Rof(i.id)).filter((r) => r != null);
    return { bk, n: its.length, seen: rs.length, avg: rs.length ? rs.reduce((a, c) => a + c, 0) / rs.length : null };
  }).filter((r) => r.seen);
  h += `<div class="card"><div class="lbl">各單元目前記憶率（FSRS 估計）</div>${rows.length ? `<table class="t"><tr><th>單元</th><th class="n">練過</th><th>平均記憶率</th></tr>
    ${rows.map((r) => `<tr><td>${esc(bankName(r.bk))}</td><td class="n">${r.seen}/${r.n}</td><td>${pct(r.avg)}<div class="bar"><div style="width:${Math.round(r.avg * 100)}%"></div></div></td></tr>`).join("")}</table>` : '<div class="mut small">還沒有練習紀錄</div>'}</div>`;
  // 積欠
  const tmr = dayStart(addDays(day, 1));
  const overdue = Object.keys(st.cards).filter((id) => ITEMS[id] && st.cards[id].due < tmr && !(Dt && Dt.set.includes(id))).length;
  const fcBanks = LEARNED.concat(SCHEDULE.filter((x) => x.testDate <= day).map((x) => x.bank));
  const unchecked = fcBanks.reduce((n, bk) => n + (BANK_ITEMS[bk] || []).filter((i) => !st.cards[i.id]).length, 0);
  h += `<div class="card"><div class="lbl">積欠</div><div class="stat"><div><b>${overdue}</b>到期但今天排不下</div><div><b>${unchecked}</b>舊字還沒首次檢測</div></div></div>`;
  return h;
}

/* ============================================================
   selftest：假時鐘模擬 30 天
   ============================================================ */
async function runSelftest() {
  const out = [], results = [];
  const check = (name, ok, detail) => { results.push(!!ok); out.push(`${ok ? "PASS" : "FAIL"}  ${name}${detail ? "　" + detail : ""}`); };
  store = { load: () => null, save: () => {} };   // 不碰真實存檔
  const T = (d, hm) => Date.parse(`${d}T${hm || "19:00"}:00+08:00`);

  // --- FSRS ---
  S = freshState();
  check("R(S,S) = 0.9", Math.abs(fsrs.R(10, 10) - 0.9) < 1e-9);
  check("間隔(S) = S（目標記憶率 0.9）", Math.abs(fsrs.ivl(7) - 7) < 1e-9);
  check("D 在 1–10", [1, 2, 3, 4].every((g) => fsrs.initD(g) >= 1 && fsrs.initD(g) <= 10) && fsrs.nextD(10, 1) <= 10 && fsrs.nextD(1, 4) >= 1);
  const s1 = fsrs.recallS(5, 10, 0.9, 3), s2 = fsrs.recallS(5, 10, 0.9, 2), s0 = fsrs.forgetS(5, 10, 0.9);
  check("良好讓 S 變大、困難較小、重來變小", s1 > s2 && s2 > 10 && s0 < 10, `良好=${s1.toFixed(1)} 困難=${s2.toFixed(1)} 重來=${s0.toFixed(1)}`);
  check("20 秒分界：20.0 秒良好、20.001 秒困難、拼錯重來", gradeOf(true, 20000) === 3 && gradeOf(true, 20001) === 2 && gradeOf(false, 3000) === 1);
  let t0 = T("2026-10-03");
  S.cards.big = { st: 500, df: 3, reps: 9, lapses: 0, last: t0 - 40 * DAY, due: t0 };
  review("big", 3, t0);
  check("最大間隔 45 天", S.cards.big.due <= dayStart(addDays("2026-10-03", MAX_IVL)));
  const tm = T("2027-03-01");
  S.cards.sw = { st: 300, df: 3, reps: 9, lapses: 0, last: tm - 40 * DAY, due: tm };
  review("sw", 3, tm);
  check("考前總掃：3/1 複習的卡會在考前 6 週內到期", dayOf(S.cards.sw.due) >= SWEEP_START && dayOf(S.cards.sw.due) < EXAM_DATE, dayOf(S.cards.sw.due));
  const tw = T("2027-04-10");
  S.cards.sw2 = { st: 300, df: 3, reps: 9, lapses: 0, last: tw - 40 * DAY, due: tw };
  review("sw2", 3, tw);
  check("總掃期間的卡在考前到期", dayOf(S.cards.sw2.due) < EXAM_DATE, dayOf(S.cards.sw2.due));
  const leak = DATA.items.filter((it) => it.collocations.some((c) => new RegExp("\\b" + it.ans.split(" ")[0] + "\\b", "i").test(collFront(c))));
  check("拼寫卡正面（搭配詞挖空）不洩答案", !leak.length, leak.map((i) => i.en).join(", "));
  const badOpt = DATA.items.filter((it) => { const o = distractors(it); return o.length !== 4 || new Set(o).size !== 4 || !o.includes(it.zh); });
  check("認得練習 4 個選項、不重複、含正解", !badOpt.length, badOpt.map((i) => i.en).join(", "));
  check("拼寫判分寬鬆（大小寫、全形、空白、句點）", spellOk(ITEMS["believe"], " Believe. ") && spellOk(ITEMS["believe"], "ｂｅｌｉｅｖｅ") &&
    spellOk(ITEMS["feel like + ving"], "feel like") && !spellOk(ITEMS["believe"], "belive"));

  // --- 單日隊伍規則（手做一個小隊伍） ---
  const mkQ = (ids, steps) => ({ queue: ids.map((id) => ({ id, k: "recall", tag: "rev", steps: steps || null, step: 0, hard: 0, after: 0, t: 0 })), ans: 0, fails: {} });
  const ids6 = DATA.items.slice(0, 6).map((i) => i.id);
  S = freshState();
  let t = T("2026-10-20");
  clock.t = t;
  ids6.forEach((id) => { S.cards[id] = { st: 5, df: 5, reps: 3, lapses: 0, last: t - 5 * DAY, due: t }; });
  S.days[dayOf(t)] = { set: [], queue: [], ans: 0, graded: {}, fails: {}, boosts: {}, mock: null, mockFirst: {}, passed: false, ms: 0, lastAct: 0, est: 0, fc: 0, extra: 0 };
  let Q = mkQ(ids6);
  answerRecall(Q, pick(Q, t), false, 5000, t);           // 第 1 張拼錯
  const stAfterAgain = S.cards[ids6[0]].st, repsAfter = S.cards[ids6[0]].reps;
  const seq = [];
  for (let k = 0; k < 5; k++) { t += 15e3; const p = pick(Q, t); seq.push(p.e.id); if (p.e.id === ids6[0]) break; answerRecall(Q, p, true, 5000, t); }
  const back = seq.indexOf(ids6[0]);
  check("拼錯的卡至少隔 3 張且 ≥ 60 秒才再出", back >= 3 && t - T("2026-10-20") >= 60e3, `隔 ${back} 張、${(t - T("2026-10-20")) / 1000} 秒後再出`);
  answerRecall(Q, pick(Q, t), true, 5000, t);
  check("長期排程只吃當天第一次作答（之後拼對不改 FSRS）", S.cards[ids6[0]].st === stAfterAgain && S.cards[ids6[0]].reps === repsAfter);
  Q = mkQ([ids6[1]]); S.days[dayOf(t)].graded = {};
  answerRecall(Q, pick(Q, t), false, 5000, t);
  const p1 = pick(Q, t + 1000);
  check("只剩這一張時直接出（不讓學生乾等）", p1 && p1.e.id === ids6[1] && p1.early);
  for (let k = 0; k < 3; k++) answerRecall(Q, pick(Q, t), false, 5000, t);
  check("同一字錯滿 4 次 → 下一張是加強卡", Q.queue[0].k === "boost" && Q.queue[0].id === ids6[1]);
  // 加強卡不算一張：看完加強卡後，這個字還要再隔 3 張「真的卡」且 ≥ 60 秒
  Q = mkQ(ids6.slice(0, 6)); S.days[dayOf(t)].graded = {}; Q.fails[ids6[0]] = 3;
  let tb = t;
  answerRecall(Q, pick(Q, tb), false, 5000, tb);
  tb += 5e3; const pb = pick(Q, tb);
  finishOther(Q, pb, tb);
  const tAfterBoost = tb, seqB = [];
  for (let k = 0; k < 8; k++) { tb += 15e3; const p = pick(Q, tb); seqB.push(p.e.id); if (p.e.id === ids6[0]) break; answerRecall(Q, p, true, 5000, tb); }
  check("加強卡後：至少隔 3 張真的卡、≥ 60 秒才再考（加強卡不算）", pb.e.k === "boost" && seqB.indexOf(ids6[0]) >= 3 && tb - tAfterBoost >= 60e3,
    `加強卡後隔 ${seqB.indexOf(ids6[0])} 張、${(tb - tAfterBoost) / 1000} 秒`);
  // 都還沒到時間：不讓剛出過的同一張馬上再出
  Q = { queue: [{ id: "a", k: "recall", after: 99, t: t + 10e3 }, { id: "b", k: "recall", after: 99, t: t + 90e3 }], ans: 0, real: 0, fails: {}, lastId: "a" };
  const pe = pick(Q, t);
  check("提早出卡時跳過剛出過的那張（還有別張就先出別張）", pe.e.id === "b" && pe.early);
  // 總複習不碰今天的清單、還沒輸入的新字
  S = freshState(); t = T("2026-10-08"); clock.t = t;
  BANK_ITEMS.u8_lower.forEach((it) => { S.intro[it.id] = t - DAY; S.cards[it.id] = { st: 3, df: 5, reps: 1, lapses: 0, last: t - DAY, due: t + DAY }; });
  const Dfree = today(t);
  const allBanks = new Set(DATA.banks);
  const Fq = buildFree(allBanks, 400, t);
  const leakFree = Fq.queue.filter((e) => Dfree.set.includes(e.id) || (SCHEDULE.some((b) => b.bank === ITEMS[e.id].bank) && !S.intro[e.id]));
  check("總複習不含今天清單與還沒輸入的新字", Fq.queue.length > 0 && !leakFree.length, `${Fq.queue.length} 張，違規 ${leakFree.length}`);
  const bid = Dfree.set[0], before2 = JSON.stringify(S.cards[bid]);
  const Fx = { queue: [{ id: bid, k: "recall", tag: "rev", steps: null, step: 0, hard: 0, after: 0, t: 0 }], ans: 0, real: 0, fails: {}, day: dayOf(t) };
  answerRecall(Fx, pick(Fx, t), true, 5000, t);
  check("自由練習答到今天清單的字：不寫 graded、不動 FSRS", Dfree.graded[bid] === undefined && JSON.stringify(S.cards[bid]) === before2);
  // 新字學習步驟：良好→10 分、困難→重複這一步、重來→回 1 分
  S = freshState(); t = T("2026-10-20"); clock.t = t;
  S.days[dayOf(t)] = { set: [], queue: [], ans: 0, graded: {}, fails: {}, boosts: {}, mock: null, mockFirst: {}, passed: false, ms: 0, lastAct: 0, est: 0, fc: 0, extra: 0 };
  Q = mkQ(["affect"], STEPS);
  answerRecall(Q, pick(Q, t), true, 5000, t);
  const e1 = Q.queue[0];
  check("新字良好 → 下一步（10 分後）", e1.step === 1 && e1.t === t + 10 * MIN);
  answerRecall(Q, pick(Q, t + 10 * MIN), true, 25000, t + 10 * MIN);
  check("新字困難 → 重複這一步", Q.queue[0] && Q.queue[0].step === 1 && Q.queue[0].t === t + 20 * MIN);
  answerRecall(Q, pick(Q, t + 20 * MIN), false, 5000, t + 20 * MIN);
  check("新字重來 → 回第一步（1 分）", Q.queue[0] && Q.queue[0].step === 0 && Q.queue[0].t === t + 21 * MIN);
  // 過關閘門
  S = freshState();
  t = T("2026-10-04"); clock.t = t;
  const Dg = today(t);
  const n0 = Dg.queue.length;
  let gateEarly = false, k2 = 0;
  while (Dg.queue.length && k2++ < 500) {
    const p = pick(Dg, t);
    const ok = !(k2 === 1 || (p.e.id === Dg.set[0] && k2 < 10));
    if (p.e.k === "recall") answerRecall(Dg, p, ok, 5000, t); else finishOther(Dg, p, t);
    if (Dg.passed && Dg.queue.length) gateEarly = true;
    t += 15e3;
  }
  check("過關閘門：每張在最後一次拼錯之後都拼對過才顯示完成", !gateEarly && Dg.passed && !Dg.queue.length, `${n0} 張`);

  // --- 30 天模擬 ---
  S = freshState();
  const r = rng(12345);
  const START = "2026-10-03", DAYS = +qs.get("days") || 40;   // 40 天：涵蓋新進度結束（11/7）後積欠消化、首檢收尾
  const learnedIds = LEARNED.flatMap((b) => BANK_ITEMS[b].map((i) => i.id));
  const perDay = [], gapBad = [];
  let fcAllDay = null, stuck = false, gateBad = 0, multiGrade = 0, earlyAlone = 0;
  for (let di = 0; di < DAYS; di++) {
    const day = addDays(START, di);
    t = T(day); clock.t = t;
    const D = today(t);
    const start = t, lastSeen = {};
    let prevId = null;
    let guard = 0;
    for (;;) {
      const p = pick(D, t);
      if (!p) break;
      if (++guard > 1500) { stuck = true; break; }
      const id = p.e.id;
      if (p.e.k !== "recall") {
        finishOther(D, p, t);
        if (p.e.k === "boost") lastSeen[id] = { wrong: true, real: D.real || 0, t };
        prevId = id;
        t += COST[p.e.k] * 1000; clock.t = t; continue;
      }
      // 拼錯（或加強卡）後再出：要隔 ≥3 張真的卡且 ≥60 秒；提早出只准在隊伍只剩這個字時
      // 規則：沒提早 → 一定隔夠；提早 → 必須是「沒有任何一張到時間」且不是剛出過的同一張（只剩它除外）
      if (lastSeen[id] && lastSeen[id].wrong) {
        const gapN = (D.real || 0) - lastSeen[id].real, gapT = t - lastSeen[id].t;
        const alone = D.queue.every((e) => e.id === id);
        const anyReady = D.queue.some((e) => (D.real || 0) >= e.after && t >= e.t);
        if (!p.early && (gapN < MIN_GAP || gapT < 60e3)) gapBad.push(`${day} ${id} 隔${gapN}張${gapT / 1000}秒`);
        if (p.early) {
          earlyAlone++;
          if (anyReady || (prevId === id && !alone)) gapBad.push(`${day} ${id} 提早出但${anyReady ? "有別張到時間" : "是剛出過的同一張"}`);
        }
      }
      prevId = id;
      const repeat = D.graded[id] !== undefined;
      const pOk = p.e.tag === "fc" && !repeat ? 0.7 : repeat ? 0.75 : 0.85;
      const ok = r() < pOk;
      const ms = ok ? (r() < 0.2 ? 25000 : 9000) : 12000;
      const before = reviewCalls;
      answerRecall(D, p, ok, ms, t);
      if (repeat && reviewCalls !== before) multiGrade++;
      lastSeen[id] = { wrong: !ok, real: D.real || 0, t };
      if (D.passed && D.queue.length) gateBad++;
      t += ms + 4000; clock.t = t;
    }
    perDay.push({ day, paused: D.fcPaused, set: D.set.length, est: Math.round(D.est / 60), forced: D.forcedEst >= D.est, min: Math.round((t - start) / MIN), ans: D.ans, fc: D.fc, passed: D.passed,
      boosts: Object.values(D.boosts).reduce((a, b) => a + b, 0),
      backlog: Object.values(S.cards).filter((c) => c.due < dayStart(addDays(day, 1))).length - D.set.filter((id) => S.cards[id] && S.cards[id].due < dayStart(addDays(day, 1))).length });
    if (fcAllDay == null && learnedIds.every(seen)) fcAllDay = di + 1;
  }
  clock.t = null;
  check("模擬沒有卡死（每天都做得完）", !stuck);
  check("每天結束都過關（閘門只在全部拼對後打開）", perDay.every((x) => x.passed) && !gateBad);
  // (a) 本批每天都出現
  const missA = [];
  SCHEDULE.forEach((b) => {
    for (let d = b.date; d < b.testDate; d = addDays(d, 1)) {
      if (!S.days[d]) continue;
      BANK_ITEMS[b.bank].forEach((it) => { if (S.days[d].graded[it.id] === undefined) missA.push(`${d} ${it.id}`); });
    }
  });
  check("(a) 本批 18 項考前每天都拼到", !missA.length, missA.slice(0, 5).join(", "));
  // (b) 份量
  const overB = perDay.filter((x) => x.est * 60 > BUDGET_SEC + 60 && !x.forced);
  check(`(b) 每天清單估計 ≤ ${BUDGET_SEC / 60} 分鐘（超過的只能是本批強制）`, !overB.length,
    `估計分鐘 ${perDay.map((x) => x.est).join(",")}；模擬實際分鐘 ${perDay.map((x) => x.min).join(",")}`);
  // (c) 舊字首檢
  // 目標原本是 ~25 天；但「積欠 > 30 張就暫停首檢」在新進度期間幾乎每隔一天觸發 → 實際約 37 天（新進度結束後才收尾）
  check(`(c) 已學 ${learnedIds.length} 項全部首檢（積欠複習 > ${BACKLOG_PAUSE} 張的日子暫停首檢；目標 ~25 天，容許到 40 天）`, fcAllDay != null && fcAllDay <= 40,
    `第 ${fcAllDay} 天完成；逐日 ${perDay.map((x) => x.fc).join(",")}；暫停首檢 ${perDay.filter((x) => x.paused).map((x) => x.day.slice(5)).join(" ") || "無"}`);
  const d30 = perDay[Math.min(29, perDay.length - 1)].backlog, maxBacklog = Math.max(...perDay.map((x) => x.backlog));
  check("(f) 積欠的到期複習有上限（第 30 天 ≤ 60 張）", d30 <= 60,
    `第 30 天留到明天 ${d30} 張；期間最多 ${maxBacklog} 張；第 ${perDay.length} 天 ${perDay[perDay.length - 1].backlog} 張`);
  // (d) 拼錯後至少隔 3 張、60 秒
  check("(d) 拼錯的卡隔 ≥3 張真的卡且 ≥60 秒再出；提早出只在沒有任何一張到時間時、且不重出剛出過的同一張", !gapBad.length,
    gapBad.length ? gapBad.slice(0, 5).join("; ") : `提早出 ${earlyAlone} 次（都是其他卡也還在等）`);
  check("(e) 長期排程每字每天只評一次", !multiGrade);
  await syncSelftest(check, T);
  out.push("\n逐日明細（張數／估計分／模擬分／作答次／首檢／加強卡／留到明天）：\n" +
    perDay.map((x) => `${x.day} ${x.set}張 估${x.est}分 實${x.min}分 答${x.ans} 首檢${x.fc} 加強${x.boosts} 留${x.backlog}${x.forced ? " ＊本批佔滿" : ""}`).join("\n"));
  const pass = results.every(Boolean);
  out.unshift(pass ? `SELFTEST PASS（${results.length} 項）` : `SELFTEST FAIL（${results.filter((x) => !x).length}/${results.length} 項失敗）`);
  setHeader("selftest", pass ? "全部通過" : "有失敗", false);
  main.innerHTML = `<pre id="selftest" data-pass="${pass}">${esc(out.join("\n"))}</pre>`;
  console.log(out.join("\n"));
  S = freshState();
}

/* ---------- 雲端同步 selftest：假伺服器（照 supabase/001_srs.sql 的 srs_load / srs_save 規則），完全不連網 ---------- */
function mockServer() {
  const rows = {}, J = (x) => JSON.parse(canon(x));   // 模擬 jsonb：存進去再拿出來，key 順序會變
  const srv = { rows, maxPatch: 2000000, maxState: 4000000,
    add(tk, name) { rows[tk] = { sid: "sid-" + name, name, rev: 0, state: J(freshState()) }; },
    call(n, a) {
      const row = TOKEN_RE.test(a.p_token || "") && rows[a.p_token];
      if (!row) return { ok: false, error: "invalid_link" };
      if (n === "srs_load") return a.p_rev != null && a.p_rev === row.rev
        ? { ok: true, sid: row.sid, name: row.name, rev: row.rev, unchanged: true }
        : { ok: true, sid: row.sid, name: row.name, rev: row.rev, state: J(row.state) };
      if (n !== "srs_save") throw new Error("unknown rpc " + n);
      const p = a.p_patch;
      if (!isObj(p) || Object.keys(p).some((k) => !["cards", "intro", "days", "log"].includes(k))) return { ok: false, error: "bad_patch" };
      if (JSON.stringify(p).length > srv.maxPatch) return { ok: false, error: "too_large" };
      if (a.p_base_rev !== row.rev) return { ok: false, error: "conflict", rev: row.rev, state: J(row.state) };
      if (!Object.keys(p).length) return { ok: true, rev: row.rev };
      const s = J(row.state);
      ["cards", "intro", "days"].forEach((k) => { if (p[k]) Object.assign(s[k], J(p[k])); });
      if (p.log) {
        const m = new Map();
        s.log.concat(J(p.log)).forEach((e) => { if (!m.has(logKey(e))) m.set(logKey(e), e); });
        s.log = [...m.values()].sort((x, y) => x.t - y.t || (x.id < y.id ? -1 : 1)).slice(-LOG_CAP);
      }
      if (JSON.stringify(s).length > srv.maxState) return { ok: false, error: "too_large" };
      row.state = s; row.rev++;
      return { ok: true, rev: row.rev };
    } };
  return srv;
}

  const A = freshState(), B = freshState();

  A.cards.z = C(100, 2, 900); B.cards.z = C(100, 2, 400);

  const revR = srv.rows[TK].rev;
  rep.sync.setToken(TK); await rep.sync.pull();
  check("同步：選「以雲端為準」→ 這台換成雲端進度、雲端不被改", rep.asks.join() === "bind" && same(rep.S, srvS()) && srv.rows[TK].rev === revR);

  // 換成另一位學生的連結
  srv.add(TK2, "另一生");
  phone.answer = false;
  phone.sync.setToken(TK2); await phone.sync.pull();
  check("同步：換成別的學生連結、按取消 → 維持原本的學生", phone.meta.token === TK && phone.asks.join() === "switch");
  phone.answer = true;
  phone.sync.setToken(TK2); await phone.sync.pull();
  check("同步：換學生按確定 → 改用新學生的雲端進度（不把舊學生的進度灌進去）",
    phone.meta.token === TK2 && same(phone.S, srv.rows[TK2].state) && !Object.keys(srv.rows[TK2].state.cards).length);

  // 錯誤處理
  const bad = mkDev();
  bad.sync.setToken("ffffffffffffffffffffffffffffffff"); await bad.sync.pull();
  check("同步：錯的連結 → 顯示「連結已失效」、不上傳", bad.st === "invalid" && !bad.calls.includes("srs_save"));
  check("同步：格式不對的代碼（含 HTML）直接不收", !bad.sync.setToken("<script>") && !bad.sync.setToken("abc"));
  srv.maxPatch = 50;
  playDev(tablet, "2026-10-10", 2, 1, "19:00"); await tablet.sync.push();
  check("同步：上傳太大被雲端拒收 → 顯示錯誤、本機不受影響", tablet.st === "toolarge" && tablet.S.days["2026-10-10"].ans === 2);
  srv.maxPatch = 2000000;

  // 上傳絕不讓雲端倒退（另一位學生，跟上面互不影響）
  const TK3 = "00112233445566778899aabbccddeeff", s3 = () => srv.rows[TK3].state;
  srv.add(TK3, "倒退測試");
  const dA = mkDev(), dB = mkDev();
  dA.sync.setToken(TK3); await dA.sync.pull();
  dB.sync.setToken(TK3); await dB.sync.pull();
  playDev(dA, "2026-10-11", 40, 0.8, "19:00"); await dA.sync.push();
  await dB.sync.pull();
  // (1) 別台已經過關的那天：作答中的這台（進度較少）合併時保留自己的隊伍，但不能把它傳上去蓋掉雲端
  const DK = "2026-10-12";
  playDev(dB, DK, 5, 0.8, "18:00");
  dB.keep = DK;
  playDev(dA, DK, 400, 1, "19:00"); await dA.sync.push();
  const dayA = JSON.parse(JSON.stringify(dA.S.days[DK]));
  await dB.sync.pull();
  dB.keep = null;
  check("同步：作答中保留這台進度較少的那天 → 不會蓋掉別台已過關的雲端那天",
    dayA.passed && s3().days[DK].passed === true && s3().days[DK].ans === dayA.ans && dB.S.days[DK].ans === 5,
    `雲端 ${DK}：過關 ${s3().days[DK].passed}、作答 ${s3().days[DK].ans}（平板 ${dayA.ans}）`);
  await dB.sync.pull(); await dA.sync.pull();
  // (2) 本機存檔倒退（存檔失敗但同步紀錄有存到／從備份還原），重開網頁 → 不能拿舊卡蓋掉雲端較新的卡
  const oldS = JSON.parse(JSON.stringify(dA.S));
  playDev(dA, "2026-10-13", 30, 0.8, "19:00"); await dA.sync.push();
  const cloudBefore = JSON.parse(JSON.stringify(s3()));
  dA.S = oldS; reopen(dA);
  await dA.sync.pull(); await dA.sync.push();
  const regressed = Object.keys(cloudBefore.cards).filter((id) => !s3().cards[id] || s3().cards[id].last < cloudBefore.cards[id].last);
  check("同步：本機存檔倒退後重開 → 雲端每張卡都沒變舊、今天的進度沒變少",
    !regressed.length && s3().days["2026-10-13"].ans === cloudBefore.days["2026-10-13"].ans, `變舊 ${regressed.length} 張`);
  check("同步：本機存檔倒退後重開 → 這台把雲端較新的進度拿回來", same(dA.S, s3()));
  playDev(dA, "2026-10-14", 12, 0.8, "19:00"); await dA.sync.push();
  check("同步：上傳後這台記得的雲端那包跟雲端一模一樣、沒有待上傳（不會一直重送）",
    same(dA.sync.snapshot(), s3()) && !Object.keys(diffState(dA.S, dA.sync.snapshot())).length && dA.st === "ok");

  // 老師儀表板
  const tt = T("2026-10-09", "21:00");
  const html = dashHtml(cleanState(srvS()), tt);
  check("老師儀表板：算得出來、沒有 undefined / NaN", html.includes("近 14 天") && html.includes("本批準備度") && !/undefined|NaN/.test(html));
  const evil = cleanState(srvS());
  evil.cards['<img src=x onerror=alert(1)>'] = C(1, 9, 1);
  evil.days["2026-10-09"].fails["<script>alert(1)<\/script>"] = 99;
  check("老師儀表板：學生端寫進來的怪字串不會變成 HTML", !/<img src=x|<script>/i.test(dashHtml(evil, tt)));
  clock.t = null;
}

/* ============================================================
   啟動
   ============================================================ */
const SYNC_TEXT = { local: "進度存在這台裝置", nolink: "只存在這台裝置・點這裡連結雲端", busy: "同步中…", pending: "同步中…",
  offline: "離線，稍後同步", invalid: "連結已失效・點這裡貼上老師給的新連結", error: "雲端同步出錯，稍後會再試", toolarge: "雲端存檔太大，請告訴老師" };
let sync = null, syncCode = "local";
function setSync(code) {
  syncCode = code;
  const el = $("syncSt");
  el.textContent = code === "ok" ? "已同步 " + new Date().toLocaleTimeString("zh-TW", { timeZone: "Asia/Taipei", hour: "2-digit", minute: "2-digit", hour12: false })
    : SYNC_TEXT[code] || "";
  el.classList.toggle("act", code === "nolink" || code === "invalid");
}
let sbStudent = null;
async function studentRpc(name, args) {
  if (!sbStudent) {
    await loadSdk();
    sbStudent = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY,
      { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
  }
  const r = await Promise.race([sbStudent.rpc(name, args), new Promise((_, rej) => setTimeout(() => rej({ offline: true }), 15000))]);
  if (r.error) throw { offline: !r.error.code, message: r.error.message };   // 沒有錯誤碼＝網路斷了
  return r.data;
}

async function bootStudent() {
  // 雲端模式下用 ?today= 測試：另存一份、不同步（假日期的紀錄不能混進學生真正的進度）
  const testDay = CLOUD && !!qs.get("today");
  if (testDay) store = {
    load() { try { return JSON.parse(localStorage.getItem(STORE_KEY + "-test")); } catch (e) { return null; } },
    save(st) { try { localStorage.setItem(STORE_KEY + "-test", JSON.stringify(st)); } catch (e) { console.warn("存檔失敗", e); } },
  };
  const saved = store.load();
  if (saved && saved.v === 2) S = Object.assign(freshState(), saved);
  if (testDay) $("syncSt").textContent = "測試日期模式：另存一份、不同步雲端";
  else if (CLOUD) {
    $("tlink").innerHTML = ' ‧ <a href="?teacher=1">老師</a>';
    const local = syncAdapter;
    sync = makeSync({
      rpc: studentRpc,
      getS: () => S, setS: (x) => { S = x; }, saveLocal: () => local.save(S),
      metaLoad: () => { try { return JSON.parse(localStorage.getItem(SYNC_KEY)); } catch (e) { return null; } },
      metaSave: (m) => { try { localStorage.setItem(SYNC_KEY, JSON.stringify(m)); } catch (e) { console.warn("同步紀錄存不了", e); } },
      status: setSync,
      keepDay: () => session ? dayOf(now()) : null,
      todayKey: () => dayOf(now()),
      ask: async (kind, info) => confirm(kind === "switch"
        ? `這台裝置原本連結的是「${info.from || "另一位學生"}」，要換成「${info.to}」嗎？\n\n換了之後這台會改用「${info.to}」的雲端進度（原本還沒同步上去的紀錄會不見）。`
        : `這台裝置已經有練習紀錄（${info.n} 個字）。\n\n要把它合併到「${info.to}」的雲端進度嗎？\n確定＝合併（學生自己的手機選這個）\n取消＝這台改用雲端進度（這台原本的紀錄會被取代）`),
      onMerged: (first, stale) => {
        if (session) return;
        if (first && stale) delete S.days[dayOf(now())];   // 今天的清單是合併前用舊資料排的、還沒動過 → 重排
        if (first || $("goFree")) home();
      },
    });
    store = { load: () => local.load(), save: (st) => { local.save(st); sync.schedule(); } };
    if (qs.has("s")) {   // 代碼存進這台後就從網址拿掉（避免截圖、分享網址時外流）
      sync.setToken((qs.get("s") || "").toLowerCase());
      const u = new URL(location.href); u.searchParams.delete("s");
      history.replaceState(null, "", u.pathname + u.search + u.hash);
    }
    $("syncSt").onclick = async () => {
      if (syncCode !== "nolink" && syncCode !== "invalid") return;
      if (session) return toast("先回首頁再連結");
      const v = (prompt("貼上老師給的連結") || "").trim().toLowerCase();
      const mt = v.match(/[?&]s=([0-9a-f]{32})\b/) || v.match(/^([0-9a-f]{32})$/);
      if (!mt) { if (v) toast("看不懂這個連結"); return; }
      sync.setToken(mt[1]);
      await sync.pull();
      if (!session) home();
    };
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") sync.push();
      else if (!session) sync.pull();
    });
    window.addEventListener("online", () => sync.pull());
    if (sync.meta().token) {
      const first = !sync.meta().pulled;
      if (first) main.innerHTML = `<div class="card mut">第一次跟雲端同步進度…</div>`;
      await Promise.race([sync.pull(), new Promise((r) => setTimeout(r, first ? 10000 : 3000))]);
    } else setSync("nolink");
  }
  home();
}

fetch("data/cards.json").then((r) => r.json()).then((d) => {
  indexData(d);
  if (qs.get("selftest") === "1") return runSelftest();
  if (qs.get("teacher") === "1") return teacherBoot();
  return bootStudent();
}).catch((e) => { main.innerHTML = `<div class="card">資料載入失敗：${esc(e.message)}</div>`; console.error(e); });

if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js");
